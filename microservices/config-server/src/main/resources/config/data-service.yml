server:
  port: 8022
  servlet:
    context-path: /data

spring:
  config:
    import: classpath:/config/common.yml

resilience4j:
  circuitbreaker:
    instances:
      sampleService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      sampleService:
        maxAttempts: 2
        waitDuration: 2s

process:
  service:
    baseUrl: http://process-service