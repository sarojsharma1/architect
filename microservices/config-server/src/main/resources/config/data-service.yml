server:
  port: 8022
  servlet:
    context-path: /data

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: user

  redis:
    host: localhost
    port: 6379
    password: user

  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/test   #mongodb://<username>:<password>@<host>:<port>/<database>

  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe          #jdbc:oracle:thin:@<host>:<port>:<SID or service>
    username: user
    password: user
    driver-class-name: oracle.jdbc.OracleDriver

process:
  service:
    baseUrl: http://process-service

resilience4j:
  circuitbreaker:
    instances:
      sampleService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      sampleService:
        maxAttempts: 2
        waitDuration: 2s