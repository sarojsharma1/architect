server:
  port: 8022
  servlet:
    context-path: /data

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: user

  redis:
    host: localhost
    port: 6379
    password: user

process:
  service:
    baseUrl: http://process-service

resilience4j:
  circuitbreaker:
    instances:
      sampleService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      sampleService:
        maxAttempts: 2
        waitDuration: 2s