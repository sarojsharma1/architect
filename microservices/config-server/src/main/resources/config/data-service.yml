server:
  port: 8022
  servlet:
    context-path: /data

spring:
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/test   #mongodb://<username>:<password>@<host>:<port>/<database>
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe          #jdbc:oracle:thin:@<host>:<port>:<SID or service>
    username: user
    password: user
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect

resilience4j:
  circuitbreaker:
    instances:
      sampleService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      sampleService:
        maxAttempts: 2
        waitDuration: 2s


process:
  service:
    baseUrl: http://process-service