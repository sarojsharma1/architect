server:
  port: 8021

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: process-service
              uri: lb://process-service
              predicates:
                - Path=/process/**

            - id: data-service
              uri: lb://data-service
              predicates:
                - Path=/data/**

            - id: auth-server
              uri: http://localhost:8085
              predicates:
                - Path=/auth/**
    discovery:
      locator:
        enabled: true
        lower-case-service-id: true