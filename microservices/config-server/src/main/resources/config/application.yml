#Common properties of microservices.
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8085/oauth2/jwks
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: user
  redis:
    host: localhost
    port: 6379
    password: user

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: always